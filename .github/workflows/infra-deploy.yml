name: Deploy infra (Bicep apply)

# WARNING: This workflow MUTATES live Azure infrastructure.
# It runs `az deployment sub create` (no --what-if) against the production
# subscription. Treat every manual trigger as a live infrastructure change.
#
# Trigger: workflow_dispatch ONLY (v1).
# Auto-trigger on push-to-main when infra/** changes was an open question in
# #83 (blast radius concern). Deferred to a follow-up PR once this manual
# workflow has been exercised and trusted.
#
# What-if preview (informational, PR-gated) lives in infra-what-if.yml — leave
# that workflow alone. This file is the apply companion.
#
# Successful applies are recorded as GitHub Deployments on the `prod-infra`
# environment. See #315 for the deployment-recording rationale.
#
# Reference: https://github.com/glitchwerks/mom-bot/issues/83

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to check out. Defaults to HEAD of `main`. Must match a SHA present on main."
        type: string
        required: false
        default: ""

concurrency:
  group: infra-deploy
  cancel-in-progress: false  # Do NOT cancel an in-flight deployment — partial Bicep applies are dangerous.

permissions:
  id-token: write  # required for OIDC federated login to Azure
  contents: read   # actions/checkout
  deployments: write  # record successful applies against prod-infra

jobs:
  deploy:
    name: Apply Bicep to prod subscription
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.ref }}

      - name: Capture Deployed SHA
        id: capture_deployed_sha
        run: |
          DEPLOYED_SHA=$(git rev-parse HEAD)
          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved deployed SHA: $DEPLOYED_SHA"

      - name: Azure login (OIDC — no client secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve current live container image
        run: |
          # Fetch the image currently running in prod so the bicepparam's
          # readEnvironmentVariable resolves to the live image rather than
          # the quickstart placeholder — prevents a phantom containerImage
          # diff on every apply.
          set +e
          IMG=$(az containerapp show --name ca-mom-bot --resource-group mom-bot \
            --query "properties.template.containers[0].image" -o tsv 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::notice::Container app not found (cold-start scenario) — using bicepparam quickstart default"
            # CONTAINER_IMAGE intentionally left unset; bicepparam's
            # readEnvironmentVariable('CONTAINER_IMAGE', '<quickstart>')
            # falls back to the default.
          else
            echo "CONTAINER_IMAGE=$IMG" >> "$GITHUB_ENV"
          fi

      - name: Apply Bicep deployment
        id: apply
        run: |
          set +e
          az deployment sub create \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --name "infra-${{ github.run_id }}" \
            > deploy-output.txt 2>&1
          RC=$?
          # Always show output in the log — critical for diagnosing failures
          cat deploy-output.txt
          exit $RC

      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## Bicep deployment succeeded"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Deployment name | \`infra-${{ github.run_id }}\` |"
            echo "| Subscription | \`${{ vars.AZURE_SUBSCRIPTION_ID }}\` |"
            echo "| Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Recorded deployment SHA | \`${{ steps.capture_deployed_sha.outputs.deployed_sha }}\` |"
            echo
            echo "To inspect in the Azure portal, navigate to:"
            echo "\`Subscriptions → ${{ vars.AZURE_SUBSCRIPTION_ID }} → Deployments → infra-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # UNVERIFIED: whether POST /deployments auto-creates the prod-infra GitHub
      # environment, or whether it must be pre-created under repo Settings > Environments,
      # is not confirmed at write time. If this step fails with a 422, that is the first
      # thing to check.
      - name: Record GitHub Deployment
        if: success()
        env:
          DEPLOYED_SHA: ${{ steps.capture_deployed_sha.outputs.deployed_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          DEPLOYMENT_RESPONSE=$(gh api --method POST \
            "/repos/${{ github.repository }}/deployments" \
            --input - <<EOF
          {
            "ref": "$DEPLOYED_SHA",
            "environment": "prod-infra",
            "task": "deploy:infra",
            "auto_merge": false,
            "required_contexts": [],
            "description": "Bicep apply via run ${{ github.run_id }}",
            "payload": {
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          }
          EOF
          )
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error::GitHub deployment was not created (gh api exited $RC)."
            echo "::error::If the deployment-create call failed with a 422, the 'prod-infra' environment may need to be pre-created under repo Settings > Environments before this workflow can succeed."
            exit 1
          fi

          set +e
          DEPLOYMENT_ID=$(jq -er '.id | numbers' <<< "$DEPLOYMENT_RESPONSE")
          RC=$?
          set -e
          if [ $RC -ne 0 ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::GitHub deployment was not created: the API response did not contain a numeric deployment id."
            echo "::error::If the deployment-create call failed with a 422, the 'prod-infra' environment may need to be pre-created under repo Settings > Environments before this workflow can succeed."
            exit 1
          fi

          gh api --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            --input - <<EOF
          {
            "state": "success",
            "description": "Bicep apply ${{ github.run_id }}"
          }
          EOF
