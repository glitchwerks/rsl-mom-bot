name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.actor == 'dependabot[bot]' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Fix hint (lockfile out of sync)
        if: failure()
        run: echo "uv.lock is out of sync with pyproject.toml — run 'uv lock' locally and commit the result."
      - name: Install dev dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Run ruff
        run: ruff check src/ tests/

  format:
    name: Format (black)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.actor == 'dependabot[bot]' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Run black
        run: black --check src/ tests/

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.actor == 'dependabot[bot]' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Run mypy
        run: mypy src/

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.actor == 'dependabot[bot]' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Run pytest
        run: pytest

  docker-build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.actor == 'dependabot[bot]' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} --build-arg BUILD_NUMBER=42 --tag mom-ci-version .
      - name: Verify image source metadata
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e EXPECTED_SOURCE_SHA=${{ github.sha }} -e EXPECTED_BUILD_NUMBER=42 \
            --entrypoint /app/.venv/bin/python mom-ci-version \
            -c 'import os; assert os.environ["GIT_SHA"] == os.environ["EXPECTED_SOURCE_SHA"]; assert os.environ["BUILD_NUMBER"] == os.environ["EXPECTED_BUILD_NUMBER"]'

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.actor == 'dependabot[bot]' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          scandir: "."
          ignore_paths: ".venv"

  pip-audit:
    name: pip-audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name == 'push' ||
      github.actor == 'dependabot[bot]' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: uv pip install pip-audit --system
      - name: Upgrade pip (clear pip CVEs that have a fix)
        run: uv pip install --system --upgrade "pip>=26.1"
      - name: Run pip-audit
        run: pip-audit
